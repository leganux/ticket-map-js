<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Compra · Dream Event</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/dream-event-common.css" rel="stylesheet" />
    <link href="css/dream-event-selector.css" rel="stylesheet" />
    <link href="css/dream-event-mobile.css" rel="stylesheet" />
    <style>
      body { margin: 0; background: #f7f7fb; }
      .demo-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: #fff; border-bottom: 1px solid #e6e3f1; font: 14px system-ui, sans-serif; }
      .demo-bar select { max-width: 260px; }
      .demo-bar .mode { margin-left: auto; color: #5f5d75; }
      #selector { padding: 16px; }
      body.de-is-mobile #selector { padding: 0; }
      @media (max-width: 640px) {
        .demo-bar { gap: 6px; padding: 6px 10px; font-size: 12px; }
        .demo-bar label { display: flex; align-items: center; gap: 4px; }
        .demo-bar select { max-width: 150px; font-size: 12px; padding-top: 2px; padding-bottom: 2px; }
        .demo-bar .mode { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="demo-bar">
      <label>Mapa
        <select id="map" class="form-select form-select-sm d-inline-block">
          <option value="example:concert">Ejemplo: Concierto (preventa)</option>
        </select>
      </label>
      <label>Vista
        <select id="mode" class="form-select form-select-sm d-inline-block">
          <option value="auto">Automática</option>
          <option value="desktop">Escritorio</option>
          <option value="mobile">Móvil</option>
        </select>
      </label>
      <span class="mode" id="mode-label"></span>
    </div>
    <div id="selector"></div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/konva@9.3.18/konva.min.js"></script>
    <script src="js/dream-event-utils.js"></script>
    <script src="js/dream-event-schema.js"></script>
    <script src="js/dream-event-layout.js"></script>
    <script src="js/dream-event-renderer.js"></script>
    <script src="js/dream-event-templates.js"></script>
    <script src="js/dream-event-seat-selector.js"></script>
    <script src="js/dream-event-seat-selector-mobile.js"></script>
    <script>
      const params = new URLSearchParams(location.search);
      const mapSelect = document.getElementById('map');
      const modeSelect = document.getElementById('mode');
      DreamEventTemplates.list().forEach((t) => mapSelect.add(new Option('Template: ' + t.name, 'template:' + t.id)));
      mapSelect.value = params.get('map') || 'example:concert';
      modeSelect.value = params.get('mode') || 'auto';

      /** Demo availability: mark some seats as sold or held so every state is visible. */
      function demoAvailability(data) {
        const seats = {};
        let i = 0;
        data.sections.forEach((s) =>
          s.rows.forEach((r) =>
            r.seats.forEach((seat) => {
              i++;
              if (i % 11 === 0) seats[seat.id] = 'sold';
              else if (i % 17 === 0) seats[seat.id] = 'held';
            }),
          ),
        );
        return { seats, generalAdmission: {} };
      }
      async function loadMap(value) {
        const [kind, id] = value.split(':');
        if (kind === 'template') return DreamEventTemplates.get(id);
        return fetch('examples/' + id + '.json').then((r) => r.json());
      }
      // The mobile picker fills the screen below this demo bar.
      const syncOffset = () =>
        document.getElementById('selector').style.setProperty('--dem-offset', document.querySelector('.demo-bar').offsetHeight + 'px');
      addEventListener('resize', syncOffset);
      syncOffset();
      let picker;
      async function mount() {
        const data = await loadMap(mapSelect.value);
        picker && picker.destroy();
        picker = DreamEventSeatPicker.create({
          container: '#selector',
          data,
          availability: demoAvailability(data),
          mode: modeSelect.value,
          options: { maxSeats: 8, holdDurationSeconds: 600 },
          callbacks: {
            onModeChange: (mode) => {
              document.getElementById('mode-label').textContent = 'Vista actual: ' + (mode === 'mobile' ? 'móvil' : 'escritorio');
              document.body.classList.toggle('de-is-mobile', mode === 'mobile');
            },
            onSelectionChange: (s) => console.log('selección', s),
            onHoldCreated: (h) => console.log('reserva', h),
            onPurchaseSimulated: (p) => console.log('compra', p),
          },
        });
        window.picker = picker;
      }
      mapSelect.onchange = modeSelect.onchange = () => {
        history.replaceState(null, '', `?map=${mapSelect.value}&mode=${modeSelect.value}`);
        mount();
      };
      mount();
    </script>
  </body>
</html>
