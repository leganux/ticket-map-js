<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Builder · Dream Event</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/dream-event-common.css" rel="stylesheet"><link href="css/dream-event-builder.css" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head><body class="container-fluid py-3"><div id="builder"></div><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="https://cdn.jsdelivr.net/npm/konva@9.3.18/konva.min.js"></script><script src="js/dream-event-utils.js"></script><script src="js/dream-event-schema.js"></script><script src="js/dream-event-layout.js"></script><script src="js/dream-event-history.js"></script><script src="js/dream-event-renderer.js"></script><script src="js/dream-event-seat-map-builder.js"></script><script>fetch('examples/auditorium.json').then(r=>r.json()).then(data=>{data.ticketTypes=[data.ticketTypes.find(t=>t.mode==='reserved_seating')||data.ticketTypes[0]];data.sections.forEach(s=>{s.ticketTypeId=data.ticketTypes[0].id;});data.ticketTypes[0].capacity=data.sections.reduce((n,s)=>n+s.rows.reduce((m,r)=>m+r.seats.length,0),0);new DreamEventSeatMapBuilder({container:'#builder',data});});</script></body></html>
