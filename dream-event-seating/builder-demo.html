<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Builder · Dream Event</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/dream-event-common.css" rel="stylesheet" />
    <link href="css/dream-event-builder.css" rel="stylesheet" />
    <link href="css/dream-event-selector.css" rel="stylesheet" />
    <style>
      body { margin: 0; padding: 24px; background: #f7f7fb; }
    </style>
  </head>
  <body>
    <div id="builder"></div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/konva@9.3.18/konva.min.js"></script>
    <script src="js/dream-event-utils.js"></script>
    <script src="js/dream-event-schema.js"></script>
    <script src="js/dream-event-layout.js"></script>
    <script src="js/dream-event-history.js"></script>
    <script src="js/dream-event-renderer.js"></script>
    <script src="js/dream-event-templates.js"></script><script src="js/dream-event-seat-map-builder.js"></script>
    <script src="js/dream-event-seat-selector.js"></script>
    <script>
      fetch('examples/concert.json')
        .then((r) => r.json())
        .then((data) => {
          window.builder = new DreamEventSeatMapBuilder({
            container: '#builder',
            data,
            callbacks: { onComplete: (json) => console.log('onComplete', json) },
          });
        });
    </script>
  </body>
</html>
