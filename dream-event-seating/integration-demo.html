<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Integración · Dream Event</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/dream-event-common.css" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head><body class="container-fluid py-3"><h1 class="h4">Demostración integrada</h1><p>Configura un mapa, pásalo al Selector y revisa sus datos.</p><div id="builder"></div><hr><div class="d-flex gap-2"><button class="btn btn-primary" id="open-selector">Abrir selector con el mapa actual</button><button class="btn btn-outline-secondary" id="export-map">Exportar mapa JSON</button></div><div id="selector" class="mt-3"></div><pre id="state" class="bg-light border p-3 mt-3"></pre><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="https://cdn.jsdelivr.net/npm/konva@9.3.18/konva.min.js"></script><script src="js/dream-event-utils.js"></script><script src="js/dream-event-schema.js"></script><script src="js/dream-event-layout.js"></script><script src="js/dream-event-history.js"></script><script src="js/dream-event-renderer.js"></script><script src="js/dream-event-templates.js"></script><script src="js/dream-event-seat-map-builder.js"></script><script src="js/dream-event-seat-selector.js"></script><script>fetch('examples/concert.json').then(r=>r.json()).then(data=>{const b=new DreamEventSeatMapBuilder({container:'#builder',data});let selectorInstance;document.querySelector('#open-selector').onclick=()=>{selectorInstance?.destroy();selectorInstance=new DreamEventSeatSelector({container:'#selector',data:b.getData(),callbacks:{onSelectionChange:s=>document.querySelector('#state').textContent=JSON.stringify({selection:s,availability:selectorInstance?.getAvailability(),hold:selectorInstance?.getHold()},null,2)}});};document.querySelector('#export-map').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([b.getJSON()],{type:'application/json'}));a.download='dream-event-map.json';a.click();};});</script></body></html>
